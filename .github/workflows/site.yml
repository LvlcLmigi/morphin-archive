name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
      - id: build
        run: python3 build.py
        env:
          FORCE: ${{ github.event_name != 'schedule' }}
      - if: steps.build.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # a Pages deployment left hanging (its run was stopped) blocks every later one: cancel any from recent commits first
      - if: steps.build.outputs.changed == 'true'
        name: Clear stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(git log -15 --format=%H | tail -n +2); do
            curl -s -o /dev/null -w "$sha %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel" || true
          done
      - if: steps.build.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
