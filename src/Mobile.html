/* Mobile archive: one thumb-reach column, a fixed tab bar, and full-screen swipe viewers for cards and decks. */
:root{
  --bg:#0b0d13; --bg2:#10131c; --panel:#151a26; --raise:#1c2232; --line:#262e43; --line2:#34405a;
  --fg:#eef1f7; --muted:#9aa3b8; --dim:#7a849b; --accent:#E8B931; --accent-ink:#171204; --heart:#ff5a6e; --shield:#f0bf34; --hit:#ff8a5b;
  --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef0f5; --bg2:#e6e9f0; --panel:#ffffff; --raise:#f4f5f9; --line:#d9dce6; --line2:#c4cad8;
  --fg:#12151d; --muted:#565e70; --dim:#6f7789; --accent-ink:#171204; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;padding-bottom:calc(64px + var(--bot))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.gi{font-family:'HG-Icons';font-style:normal;font-weight:normal;line-height:1;display:inline-block;transform:translateY(.1em);margin:0 .04em}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0}

/* header */
.mh{position:sticky;top:0;z-index:30;padding-top:var(--top);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.mh-row{display:flex;align-items:center;gap:6px;height:54px;padding:0 8px 0 16px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--fg);transition:transform .12s,background .15s}
.ib:active{transform:scale(.9);background:var(--raise)}
.srch{display:flex;align-items:center;gap:8px;height:54px;padding:0 8px 0 12px}
.srch input{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);font:16px var(--f-body);padding:0 12px;outline:none}
.srch input:focus{border-color:var(--accent)}
.srch .cancel{height:40px;padding:0 8px;font-weight:600;color:var(--accent)}

/* filter row */
.fbar{position:sticky;top:calc(55px + var(--top));z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px 0 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.seg{display:flex;margin:0 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;position:relative}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);position:relative;z-index:1;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--accent-ink)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--accent);transition:transform .28s var(--ease),width .28s var(--ease)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:13px;font-weight:600;color:var(--muted);scroll-snap-align:start;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip i{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.count{display:flex;align-items:center;gap:8px}
.lay{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;font-weight:600;color:var(--muted)}
.lay .i{width:16px;height:16px}
.sbody .btn{flex:none}

/* screens */
.screen{animation:in .28s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sh{display:flex;align-items:flex-end;gap:10px;padding:18px 16px 10px}
.sh h1{font-size:30px}
.sh .sub{color:var(--dim);font-size:13px;margin-left:auto;white-space:nowrap}
.count{color:var(--dim);font-size:13px;padding:2px 16px 8px}
.empty{margin:28px 16px;padding:28px 18px;text-align:center;border:1px dashed var(--line2);border-radius:16px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:22px;text-transform:uppercase;color:var(--fg);margin-bottom:4px}

/* card feed */
.feed{display:grid;grid-template-columns:1fr;gap:14px;padding:6px 16px 16px}
.feed.two{grid-template-columns:1fr 1fr;gap:10px}
.ft{position:relative;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .15s var(--ease)}
.ft:active{transform:scale(.985)}
.ft .ph{position:relative;aspect-ratio:1417/827;background:var(--raise)}
.ft .ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.ft .ph img.ok{opacity:1}
.ft .cap{display:flex;align-items:center;gap:6px;padding:9px 6px 9px 12px}
.ft .cap div{flex:1;min-width:0}
.ft .cap b{display:block;font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft .cap span{display:block;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft .stripe{position:absolute;left:0;right:0;top:0;height:3px}
.feed.two .ft .cap{padding:7px 4px 7px 9px}
.feed.two .ft .cap b{font-size:14.5px}
.feed.two .ft .cap span{font-size:11.5px}
.feed.two .ft .cap .qb{display:none}
.feed.two .ft .cap b{white-space:normal;overflow-wrap:anywhere}
.qb{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:transform .12s,color .2s}
.qb:active{transform:scale(.85)}
.qb.on{color:var(--heart)}
.qb.saved{color:var(--accent)}
.qb .i{width:21px;height:21px}
.stamp{position:absolute;top:9px;left:-3px;z-index:2;transform:rotate(-12deg);transform-origin:left top;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:#d3262e;padding:3px 9px 2px 10px;border:1.5px solid rgba(255,255,255,.9);border-radius:3px;box-shadow:0 4px 10px -3px rgba(0,0,0,.5);pointer-events:none}
.sentinel{height:1px}

/* deck tiles */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 16px 16px}
.dtile{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);text-align:left;transition:transform .15s var(--ease);min-width:0}
.dtile:active{transform:scale(.97)}
.dstack{position:relative;aspect-ratio:1/1;background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--accent) 18%,var(--raise)),var(--bg2));overflow:hidden}
.dstack span{position:absolute;left:50%;top:50%;height:78%;aspect-ratio:63/88;border-radius:6px;background:var(--line2) center/cover no-repeat;border:2px solid rgba(255,255,255,.75);box-shadow:0 10px 22px -10px rgba(0,0,0,.7)}
.dstack span:nth-child(1){transform:translate(-80%,-48%) rotate(-10deg);filter:brightness(.55)}
.dstack span:nth-child(2){transform:translate(-20%,-48%) rotate(10deg);filter:brightness(.55)}
.dstack span:nth-child(3){transform:translate(-50%,-52%)}
.dtile .ct{padding:9px 11px 11px}
.dtile .ct b{display:block;font-family:var(--f-display);font-size:15.5px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;overflow-wrap:anywhere}
.dtile .ct span{font-size:12px;color:var(--dim)}

/* set rows */
.rows{display:flex;flex-direction:column;gap:10px;padding:6px 16px 16px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left;transition:transform .15s var(--ease)}
.row:active{transform:scale(.98)}
.row img{width:96px;aspect-ratio:1417/827;object-fit:cover;border-radius:8px;background:var(--raise)}
.row b{display:block;font-family:var(--f-display);font-size:18px;text-transform:uppercase;line-height:1.1}
.row span{display:block;font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .i{color:var(--dim);width:18px}

/* page heads (set / deck) */
.ph-head{padding:14px 16px 6px}
.back{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--muted)}
.back .i{width:18px;height:18px}
.ph-head h1{font-size:32px;margin-top:14px;overflow-wrap:anywhere}
.ph-head p{color:var(--muted);margin:6px 0 0;font-size:14px}
.dface{display:block;width:min(200px,56vw);aspect-ratio:63/88;margin:14px 0 4px;border-radius:12px;overflow:hidden;background:var(--raise);border:1px solid var(--line2,var(--line));box-shadow:0 22px 44px -22px rgba(0,0,0,.85)}
.dface img{width:100%;height:100%;object-fit:cover;display:block}
.dkind{display:inline-block;margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.dkchips{padding:0 16px 8px}
.rpg-head{position:relative;padding:18px 16px 16px;margin-bottom:10px;background:radial-gradient(90% 140% at 100% 0%,color-mix(in srgb,#e5322f 18%,transparent),transparent 62%),radial-gradient(70% 120% at 0% 100%,color-mix(in srgb,#1b8fe0 16%,transparent),transparent 60%)}
.rpg-head::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#e5322f 0 20%,#2b2b2b 20% 40%,#1b8fe0 40% 60%,#f4bf1c 60% 80%,#f05a9a 80%)}
.rpg-head small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.rpg-head h1{font-size:30px;line-height:1;margin-top:6px}
.rpg-head p{color:var(--muted);font-size:13.5px;margin:8px 0 0}
.row.frow{grid-template-columns:64px minmax(0,1fr) 20px}
.row.frow img,.row.frow .fph{width:64px;aspect-ratio:17/22;object-fit:cover;object-position:top;border-radius:6px;background:var(--raise)}
.row.frow .fph{display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--dim)}
.fsheet-cov{display:block;width:min(220px,60vw);aspect-ratio:17/22;object-fit:cover;object-position:top;border-radius:10px;margin:2px auto 14px;background:var(--raise);box-shadow:0 18px 34px -20px rgba(0,0,0,.8)}

<script>
const BOOT = <?!= boot ?>;
/* ---------------- backend bridge ---------------- */
const HAS_GSR = typeof google !== 'undefined' && google.script && google.script.run;
const STANDALONE = !HAS_GSR && !!BOOT.exec;
const IS_LIVE = HAS_GSR || STANDALONE;
const READ_FNS = new Set(['getData','getLiked','getDecks','getComments','getFileRange']);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function gsr_(fn,args){ return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message?e.message.replace(/^Exception: /,''):String(e))))[fn](...args)); }
async function post_(fn,args){
  let r; try{ r=await fetch(BOOT.exec,{method:'POST',body:JSON.stringify({fn,args}),credentials:'omit',redirect:'follow'}); }catch(e){ const err=new Error('Can\'t reach the archive. Check your connection.'); err.net=true; throw err; }
  let j; try{ j=await r.json(); }catch(e){ const err=new Error('Unexpected reply. Try again.'); err.net=true; throw err; }
  if(!j.ok) throw new Error(j.error||'Something went wrong.'); return j.data;
}
function timeout_(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>{ const e=new Error('The archive is taking too long. Try again.'); e.net=true; rej(e); },ms))]); }
async function api(fn,...args){
  if(!IS_LIVE) return DEMO[fn](...args);
  const call=()=>STANDALONE?post_(fn,args):gsr_(fn,args);
  if(!READ_FNS.has(fn)) return call();
  try{ return await timeout_(call(),25000); }catch(e){ if(STANDALONE&&!e.net) throw e; await sleep(800); return timeout_(call(),30000); }
}

/* ---------------- helpers ---------------- */
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const store={ get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':String(n);
const plural=(n,a,b)=>n+' '+(n===1?a:b);
const RANGER={Red:'#e5322f',Pink:'#f05a9a',Yellow:'#f4bf1c',Blue:'#1b8fe0',Green:'#14a35a',Black:'#2b2b2b',White:'#e9e9e9',Gold:'#c49a2c',Silver:'#a3a8ad',Purple:'#7a3aa3',Orange:'#f39223',Navy:'#3a3496',Crimson:'#a51e35',Shadow:'#0a7aa6'};
const colorOf=c=>RANGER[c]||'#7a8396';
const SYM_RE=/(⚡️?|💥|⛊|♥|★|王|⚀)/g, SYM_GLYPH={'⚡':'e','💥':'h','⛊':'s','♥':'s','★':'S','王':'k','⚀':'d'}, SYM_NAME={e:'Energy',h:'Hit',s:'Shield',S:'Star',k:'Gold Zeo',d:'Die'};
const richText=t=>esc(t).replace(SYM_RE,m=>{ const g=SYM_GLYPH[m.replace('️','')]; return `<i class="gi" role="img" aria-label="${SYM_NAME[g]}">${g}</i>`; });
const ago=iso=>{ const s=(Date.now()-new Date(iso))/1000; if(s<60) return 'just now'; for(const [n,l] of [[31536000,'y'],[2592000,'mo'],[604800,'w'],[86400,'d'],[3600,'h'],[60,'m']]) if(s>=n) return Math.floor(s/n)+l+' ago'; };
const sized=(u,w)=>/googleusercontent\.com\/d\//.test(u)?u.replace(/=w\d+$/,'')+'=w'+w:u;
const cardName=c=>[c.character||c.title,c.ranger].filter(Boolean).join(' — ');
const TYPES=[
  {id:'ranger', name:'Rangers', one:'Ranger', tint:'#e8b931'},
  {id:'combat', name:'Combat cards', one:'Combat card', tint:'#e5322f'},
  {id:'zord', name:'Zords', one:'Zord', tint:'#1b8fe0'},
  {id:'megazord', name:'Megazords', one:'Megazord', tint:'#9b5ac8'},
  {id:'arsenal', name:'Arsenal', one:'Arsenal card', tint:'#f39223'},
  {id:'footsoldier', name:'Foot Soldiers', one:'Foot Soldier card', tint:'#8c96a8'},
  {id:'monster', name:'Monsters', one:'Monster card', tint:'#14a35a'},
  {id:'boss', name:'Bosses', one:'Boss card', tint:'#d23b4f'},
  {id:'nemesis', name:'Nemeses', one:'Nemesis card', tint:'#1aa3c9'}
];
const typeOf=id=>TYPES.find(t=>t.id===id)||TYPES[0];
/* Ranger combat decks have no kind; enemy decks come with a face card. */
const DKIND={footsoldier:'Foot Soldier deck',monster:'Monster deck',boss:'Boss deck',nemesis:'Nemesis deck'};
const rangerDecks=()=>S.decks.filter(d=>!d.kind);
const enemyDecks=k=>S.decks.filter(d=>d.kind===k);
const ctype=c=>c.type||'ranger';
const HEX='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 36 11v18L20 38 4 29V11z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20 10 28 14.5v9L20 28l-8-4.5v-9z" fill="currentColor"/></svg>';
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2200); }
function buzz(){ try{ navigator.vibrate&&navigator.vibrate(8); }catch(e){} }
async function copy(text,msg){ try{ await navigator.clipboard.writeText(text); toast(msg); }catch(e){ toast(text); } }
const visitor=(()=>{ let v=store.get('gcg-visitor'); if(!v){ v=Math.random().toString(36).slice(2)+Date.now().toString(36); store.set('gcg-visitor',v); } return v; })();

/* ---------------- state ---------------- */
const S={ cards:[], collections:[], decks:[], files:[], scenarios:[], expansions:[], exp:'', scat:'', fcat:'', settings:{}, liked:new Set(), saved:new Set(store.get('gcg-saved',[])), deckCards:{},
  tab:'cards', kind:store.get('gcg-m-kind',''), color:'', q:'', ctype:'', dtype:'', two:store.get('gcg-m-two',false), page:{} };
const deckById=id=>S.decks.find(d=>d.id===id);
const collById=id=>S.collections.find(c=>c.id===id);
const decksOf=c=>(c.decks||[]).map(deckById).filter(Boolean);
const rangersUsing=id=>S.cards.filter(c=>(c.decks||[]).includes(id));
const cardsIn=id=>S.cards.filter(c=>c.collections.includes(id));
async function ensureDecks(ids){ const need=[...new Set(ids)].filter(id=>!S.deckCards[id]); if(!need.length) return;
  const parts=[]; for(let i=0;i<need.length;i+=40) parts.push(need.slice(i,i+40));   // the server returns at most 40 decks per request
  (await Promise.all(parts.map(p=>api('getDecks',p)))).forEach(got=>Object.assign(S.deckCards,got)); }

/* ---------------- theme ---------------- */
function applyTheme(t){ document.documentElement.dataset.theme=t; store.set('gcg-theme',t); $('meta[name="theme-color"]').content=t==='light'?'#eef0f5':'#0b0d13'; }
applyTheme(store.get('gcg-theme', matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
function applyAccent(hex){ if(/^#[0-9a-f]{6}$/i.test(hex||'')) document.documentElement.style.setProperty('--accent',hex); }

/* ---------------- back-button aware layers ---------------- */
const NAV=[]; let HIST=true;
function pushLayer(close){ NAV.push(close); try{ history.pushState({m:NAV.length},''); }catch(e){ HIST=false; } }
function popLayer(){ if(!NAV.length) return; if(HIST) history.back(); else NAV.pop()(); }
window.addEventListener('popstate',()=>{ const f=NAV.pop(); if(f) f(); });

/* ---------------- screens ---------------- */
function matches(c,q){ if(!q) return true; const hay=[c.title,c.character,c.ranger,c.series,c.color,c.abilityName,c.abilityText,(c.tags||[]).join(' '),typeOf(ctype(c)).one,decksOf(c).map(d=>d.name).join(' ')].join(' ').toLowerCase(); return q.split(/\s+/).every(t=>hay.includes(t)); }
function cardList(base){ const q=S.q.trim().toLowerCase(); return (base||S.cards).filter(c=>(!S.kind||c.kind===S.kind)&&(!S.color||c.color===S.color)&&(!S.ctype||S.tab!=='cards'||S.sub||ctype(c)===S.ctype)&&expPass(c.expansions)&&matches(c,q)).sort((a,b)=>new Date(b.created)-new Date(a.created)); }
let CUR=[]; let io=null;
function setTab(t){ S.tab=t; S.sub=null; $$('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===t?'page':'false')); render(); window.scrollTo({top:0}); }
function render(){
  const m=$('#main'); if(io){ io.disconnect(); io=null; }
  if(S.sub&&S.sub.type==='set') return renderSet(m,collById(S.sub.id));
  if(S.sub&&S.sub.type==='deck') return renderDeck(m,deckById(S.sub.id));
  if(S.sub&&S.sub.type==='rules') return renderLib(m,'rules',true);
  if(S.sub&&S.sub.type==='scenarios') return renderScen(m);
  if(S.sub&&S.sub.type==='exps') return renderExps(m);
  if(S.sub&&S.sub.type==='exp') return renderExp(m,expById(S.sub.id));
  if(S.sub&&S.sub.type==='comics') return renderComicsM(m);
  if(S.sub&&S.sub.type==='wiki') return renderWikiM(m,S.sub.id);
  if(S.sub&&S.sub.type==='cser') return renderCserM(m,crSeries(S.sub.id));
  if(S.tab==='cards') return renderCards(m);
  if(S.tab==='decks') return renderDecks(m);
  if(S.tab==='sets') return renderSets(m);
  if(S.tab==='rpg') return renderLib(m,'');
  if(S.tab==='saved') return renderFeed(m,'Saved',S.cards.filter(c=>S.saved.has(c.id)),'Nothing saved yet','Tap the bookmark on any card to keep it here. Saved cards stay on this phone.');
}
const layBtn=()=>`<button class="lay" data-lay aria-label="${S.two?'Show one card per row':'Show two cards per row'}">${ico(S.two?'grid':'grid-s')}${S.two?'Large':'Grid'}</button>`;
function filterBar(){
  const colors=Object.keys(RANGER).filter(k=>S.cards.some(c=>c.color===k));
  return `<div class="fbar"><div class="seg" id="seg"><span class="pill"></span>${[['','All'],['official','Official'],['homebrew','Homebrew']].map(([v,l])=>`<button data-kind="${v}" aria-pressed="${S.kind===v}">${l}</button>`).join('')}</div>
    ${expSelM()?`<div class="xselrow">${expSelM()}</div>`:''}<div class="chips"><button class="chip" data-color="" aria-pressed="${!S.color}">All colors</button>${colors.map(k=>`<button class="chip" data-color="${k}" aria-pressed="${S.color===k}"><i style="background:${RANGER[k]}"></i>${k}</button>`).join('')}</div></div>`;
}
function placePill(){ const seg=$('#seg'); if(!seg) return; const b=seg.querySelector('[aria-pressed="true"]'), p=seg.querySelector('.pill'); if(!b||!p) return; p.style.width=b.offsetWidth+'px'; p.style.transform=`translateX(${b.offsetLeft-3}px)`; }
function typeCount(t){ return t.id==='combat'?rangerDecks().reduce((a,d)=>a+(d.unique||0),0):S.cards.filter(c=>ctype(c)===t.id).length+(DKIND[t.id]?enemyDecks(t.id).length:0); }
function typeCover(t){ if(t.id==='combat'){ const d=rangerDecks().find(d=>d.thumb); return d?d.thumb:''; }
  if(DKIND[t.id]){ const d=enemyDecks(t.id).find(d=>d.thumb); if(d) return d.thumb; } const l=S.cards.filter(c=>ctype(c)===t.id); const c=l.find(c=>c.featured)||l[0]; return c?sized(c.thumb||c.src,420):''; }
function typeRail(){
  return `<div class="trail" id="trail" role="group" aria-label="Card types"><button class="tt ${!S.ctype?'on':''}" data-ctype="" style="--tint:var(--accent)" aria-pressed="${!S.ctype}"><span class="ta">${ico('grid')}</span><b>All cards</b><small>${S.cards.length}</small></button>${rulesTile()}${TYPES.map(t=>{ const n=typeCount(t), im=typeCover(t);
    return `<button class="tt ${S.ctype===t.id?'on':''} ${n?'':'none'}" data-ctype="${t.id}" style="--tint:${t.tint}" aria-pressed="${S.ctype===t.id}"><span class="ta">${im?`<img src="${esc(im)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:HEX}</span><b>${esc(t.name)}</b><small>${t.id==='combat'&&n?plural(rangerDecks().length,'deck','decks'):DKIND[t.id]&&enemyDecks(t.id).length?plural(enemyDecks(t.id).length,'deck','decks'):n||'None yet'}</small></button>`; }).join('')}</div>`; }
const rulesTile=()=>{ const n=filesIn('rules').length, k=(S.scenarios||[]).length; return (n?`<button class="tt" data-rules style="--tint:#e8b931"><span class="ta">${ico('book')}</span><b>Rules</b><small>${plural(n,'document','documents')}</small></button>`:'')
  +(k?`<button class="tt" data-scens style="--tint:#e5322f"><span class="ta">${ico('star')}</span><b>Scenarios</b><small>${plural(k,'scenario','scenarios')}</small></button>`:'')
  +(cmSortedM().length?`<button class="tt" data-comicsm style="--tint:#7a3aa3"><span class="ta">${ico('book')}</span><b>Comics</b><small>${plural(cmSortedM().length,'series','series')}</small></button>`:'')
  +((S.expansions||[]).length?`<button class="tt" data-exps style="--tint:#1b8fe0"><span class="ta">${ico('box')}</span><b>Expansions</b><small>${OWN.size?'You own '+OWN.size:plural(S.expansions.length,'box','boxes')}</small></button>`:''); };
function keepRail(){ const r=$('#trail'), on=r&&r.querySelector('.on'); if(on) r.scrollLeft=Math.max(0,on.getBoundingClientRect().left-r.getBoundingClientRect().left+r.scrollLeft-16); }
function renderCombat(m){
  m.innerHTML=`<section class="screen">${typeRail()}<div class="fbar">${expSelM()?`<div class="xselrow">${expSelM()}</div>`:''}<div class="chips">${['','Attack','Maneuver','Reaction'].map(k=>`<button class="chip" data-dtype="${k}" aria-pressed="${S.dtype===k}">${k?k+'s':'All'}</button>`).join('')}</div></div><div class="count"><span id="cnt">Loading combat cards…</span>${rulesBtn('combat')}</div><div id="mcombat"></div></section>`;
  keepRail(); loadMCombat(); }
async function loadMCombat(){ try{ await ensureDecks(rangerDecks().map(d=>d.id)); }catch(e){ const c=$('#cnt'); if(c) c.textContent='The combat cards could not load. Pull down to try again.'; return; } paintMCombat(); }
function paintMCombat(){ const box=$('#mcombat'); if(!box||S.ctype!=='combat'||S.tab!=='cards'||S.sub) return; if(rangerDecks().some(d=>!S.deckCards[d.id])) return;
  const q=S.q.trim().toLowerCase(), terms=q?q.split(/\s+/):[];
  const gs=[...rangerDecks()].filter(d=>expPass(d.expansions)).sort((a,b)=>a.name.localeCompare(b.name)).map(d=>{ const who=rangersUsing(d.id), hay=(d.name+' '+(d.description||'')+' '+who.map(cardName).join(' ')).toLowerCase(), hit=terms.length&&terms.every(t=>hay.includes(t));
    const cards=(S.deckCards[d.id]||[]).map((x,i)=>({x,i})).filter(({x})=>(!S.dtype||x.type===S.dtype)&&(!terms.length||hit||terms.every(t=>(x.title+' '+x.type+' '+(x.text||'')+' '+hay).toLowerCase().includes(t))));
    return {d,who,cards}; }).filter(g=>g.cards.length);
  const n=gs.reduce((a,g)=>a+g.cards.length,0);
  $('#cnt').textContent=`${plural(gs.length,'deck','decks')} · ${plural(n,'card','cards')}`+(S.q?` matching “${S.q}”`:'');
  box.innerHTML=gs.length?gs.map(({d,who,cards})=>`<div class="cgm"><button class="cgm-h" data-deck="${d.id}"><span><b>${esc(d.name)}</b><small>${plural(cards.length,'card','cards')}${who.length?' · '+esc(who.map(c=>c.character||c.title).join(', ')):''}</small></span>${ico('right')}</button>
    <div class="dcards">${cards.map(({x,i})=>dcHTML(x,`data-dk="${d.id}:${i}"`)).join('')}</div></div>`).join(''):`<div class="loading">No combat cards match.</div>`; }
function renderCards(m){ if(S.ctype==='combat') return renderCombat(m); const list=cardList(); CUR=list;
  const q=S.q.trim().toLowerCase(), ed=DKIND[S.ctype]?enemyDecks(S.ctype).filter(d=>expPass(d.expansions)&&(!q||(d.name+' '+(d.description||'')).toLowerCase().includes(q))):[];
  const decks=ed.length?`<div class="count"><span>${plural(ed.length,DKIND[S.ctype].toLowerCase(),DKIND[S.ctype].toLowerCase()+'s')}</span>${rulesBtn(S.ctype)}</div><div class="dgrid">${ed.map(deckTile).join('')}</div>`:'';
  const hide=ed.length&&!S.cards.some(c=>ctype(c)===S.ctype);   // only decks for this type, no single cards
  m.innerHTML=`<section class="screen">${typeRail()}${decks}${hide?'<div id="feed" hidden></div><div id="sentinel"></div><span id="cnt" hidden></span>':`${filterBar()}<div class="count"><span id="cnt">${plural(list.length,'card','cards')}${S.q?` matching “${esc(S.q)}”`:''}</span>${S.ctype?rulesBtn(S.ctype):''}${layBtn()}</div><div class="feed ${S.two?'two':''}" id="feed"></div><div class="sentinel" id="sentinel"></div>${list.length?'':`<div class="empty"><b>No matches</b>Try another color, card type or search.</div>`}`}</section>`;
  placePill(); keepRail(); fillFeed(list);
}
function renderFeed(m,title,base,eh,ep){ const list=cardList(base); CUR=list;
  m.innerHTML=`<section class="screen"><div class="sh"><h1>${esc(title)}</h1><span class="sub">${plural(list.length,'card','cards')}</span></div><div class="feed ${S.two?'two':''}" id="feed"></div><div class="sentinel" id="sentinel"></div>${list.length?'':`<div class="empty"><b>${esc(eh)}</b>${esc(ep)}</div>`}</section>`;
  fillFeed(list);
}
function tileHTML(c,i){
  const img=sized(c.thumb||c.src, S.two?420:720);
  const tall=c.height>c.width&&c.width>0, tp=ctype(c);
  return `<article class="ft${tall?' tall':''}" data-i="${i}"><div class="ph"><div class="sk"></div><img src="${esc(img)}" alt="${esc(c.title)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onload="this.classList.add('ok');this.previousElementSibling.remove()">${tp!=='ranger'?`<span class="ftag">${esc(typeOf(tp).one)}</span>`:''}</div>
    ${c.kind==='homebrew'?'<span class="stamp">Custom</span>':''}<span class="stripe" style="background:${colorOf(c.color)}"></span>
    <div class="cap"><div><b>${esc(c.character||c.title)}</b><span>${esc(c.ranger||c.abilityName||'')}</span></div>
    <button class="qb ${S.liked.has(c.id)?'on':''}" data-like="${c.id}" aria-label="Like">${ico(S.liked.has(c.id)?'heart-f':'heart')}</button><button class="qb ${S.saved.has(c.id)?'saved':''}" data-save="${c.id}" aria-label="Save">${ico(S.saved.has(c.id)?'save-f':'save')}</button></div></article>`;
}
function fillFeed(list){
  const feed=$('#feed'); let n=0; const step=12;
  const more=()=>{ const next=list.slice(n,n+step); feed.insertAdjacentHTML('beforeend',next.map((c,k)=>tileHTML(c,n+k)).join('')); n+=next.length; if(n>=list.length&&io){ io.disconnect(); io=null; } };
  more(); if(n<list.length){ io=new IntersectionObserver(es=>{ if(es[0].isIntersecting) more(); },{rootMargin:'900px'}); io.observe($('#sentinel')); }
}
function deckTile(d){ const pic=d.thumb?`background-image:url('${esc(d.thumb)}')`:''; const n=rangersUsing(d.id).length;
  return `<button class="dtile" data-deck="${d.id}"><div class="dstack" aria-hidden="true"><span style="${pic}"></span><span style="${pic}"></span><span style="${pic}"></span></div><div class="ct"><b>${esc(d.name)}</b><span>${d.kind?esc(DKIND[d.kind])+' · ':''}${plural(d.cards||0,'card','cards')}${n?' · '+plural(n,'Ranger','Rangers'):''}</span></div></button>`; }
function renderDecks(m){ const q=S.q.trim().toLowerCase(), dk=S.dk||'';
  const list=S.decks.filter(d=>(!q||(d.name+' '+(d.description||'')+' '+(DKIND[d.kind]||'')+' '+rangersUsing(d.id).map(cardName).join(' ')).toLowerCase().includes(q))&&(!dk||(dk==='ranger'?!d.kind:d.kind===dk))&&expPass(d.expansions));
  const kinds=[['ranger','Ranger decks'],...Object.keys(DKIND).map(k=>[k,typeOf(k).name])].filter(([k])=>S.decks.some(d=>k==='ranger'?!d.kind:d.kind===k));

/* ---------------- Roleplaying Game files ---------------- */

const CR_COLL=window.Intl&&Intl.Collator?new Intl.Collator(undefined,{numeric:true,sensitivity:'base'}):null;
const crNat=(a,b)=>CR_COLL?CR_COLL.compare(String(a||''),String(b||'')):String(a||'').localeCompare(String(b||''));
/** Issues in reading order: plain numbers first (1, 2, 10), then other numbers like "Annual 1", then by title. */
function crOrder(a,b){ const na=String(a.n||''), nb=String(b.n||''); const pa=/^\d+(\.\d+)?$/.test(na), pb=/^\d+(\.\d+)?$/.test(nb);
  if(pa&&pb&&+na!==+nb) return +na-+nb; if(pa!==pb&&(na||nb)) return pa?-1:1; return crNat(na,nb)||crNat(a.t,b.t)||String(a.at||'').localeCompare(String(b.at||'')); }

/** "Mighty Morphin #12" — the number only when the title doesn't already say it. */
function crName(c){ if(!c) return ''; const n=crNum(c), t=c.t||''; if(!n) return t; const bare=String(c.n).replace(/^0+(?=\d)/,'');
  return new RegExp('(^|[^\\d])0*'+bare.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\D|$)').test(t)?t:(t?t+' '+n:n); }
/* reading progress, kept in this browser */
const crRead=()=>new Set(store.get('cr-read',[]));
function crMarkRead(id,on){ const s=crRead(); on===false?s.delete(id):s.add(id); store.set('cr-read',[...s].slice(-3000)); }
const crAt=id=>{ try{ return +localStorage.getItem('cr-at-'+id)||0; }catch(e){ return 0; } };
function crSaveAt(id,p){ try{ if(p>0) localStorage.setItem('cr-at-'+id,p); else localStorage.removeItem('cr-at-'+id); }catch(e){} }
/** The issue to pick up in a series: the one being read, else the first unread one, else the first. */
function crContinue(sid){ const l=crIssues(sid); if(!l.length) return null; const read=crRead();
  const going=l.filter(c=>crAt(c.id)>0&&!read.has(c.id)); if(going.length) return {c:going[going.length-1],mid:true};
  const next=l.find(c=>!read.has(c.id)); return next?{c:next,mid:false,started:l.some(c=>read.has(c.id))}:null; }
const CR_CACHE={};
async function crLoadPages(c,pass){ if(CR_CACHE[c.id]) return CR_CACHE[c.id];
  const r=await api('getComic',c.id,pass||''); CR_CACHE[c.id]=r; return r; }
const CR_WARM=new Set();
function crWarm(url){ if(!url||CR_WARM.has(url)) return; CR_WARM.add(url); const i=new Image(); i.referrerPolicy='no-referrer'; i.decoding='async'; i.src=url; }

/* ---- reading order: series grouped into the eras of the comics' continuity, earliest first ---- */
const CR_ERAS=[
  {t:'The Green Ranger saga',y:'2016–2018',n:'Start here. Tommy joins the team, and Lord Drakkon, an evil Tommy from another timeline, is introduced.',s:[
    [/^mighty morphin power rangers$/,'The main series, issue #0 onward. Read it alongside Go Go Power Rangers.'],
    [/^go go power rangers$/,'The team’s first days together, running alongside the main series.'],
    [/lost chronicles/,'Side stories set between issues of the main series.'],
    [/(^|- )pink$/,'Kimberly’s own story after she leaves the team.'],
    [/rise of drakkon/,'How Lord Drakkon came to power.']]},
  {t:'Shattered Grid',y:'2018',n:'Lord Drakkon invades every Ranger timeline at once: the big event of the first run.',s:[[/shattered grid/,'The event itself.']]},
  {t:'Beyond the Grid and Necessary Evil',y:'2018–2020',n:'The aftermath of Shattered Grid, ending the first run.',s:[
    [/beyond the grid/,'Rangers stranded beyond the Morphin Grid.'],[/necessary evil/,'The finale of the first run.'],[/drakkon new dawn/,'Drakkon’s next move, after Necessary Evil.']]},
  {t:'The Omega Rangers era',y:'2020–2022',n:'Two linked series relaunch the line: a new Mighty Morphin team on Earth, and Jason, Trini and Zack as the Omega Rangers in space.',s:[
    [/^mighty morphin$/,'The new Mighty Morphin team. Read it alongside Power Rangers.'],[/^power rangers$/,'The Omega Rangers in space.'],
    [/ranger slayer/,'The Ranger Slayer, Kimberly from another reality.'],[/^power rangers unlimited$/,'One-shots about villains and alternate Rangers from this era.'],
    [/unlimited.*one-shots/,'More one-shots from this era.'],[/universe/,'A companion series from this era.']]},
  {t:'Later stories',y:'2022–2025',n:'The line continues with new teams and a fresh start.',s:[
    [/ranger academy/,'Training the next generation of Rangers.'],[/the return/,''],[/across the morphin grid/,'Stories from across the Ranger timelines.'],[/megazords ?& ?monsters/,''],[/prime/,'The grown-up Rangers return.'],[/recharged/,'']]},
  {t:'The 2026 series',y:'2026',n:'The newest series.',s:[[/\(2026\)/,'']]},
  {t:'Crossovers and specials',y:'',n:'Stand-alone stories you can read at any point.',s:[
    [/justice league/,''],[/teenage mutant ninja turtles$/,''],[/teenage mutant ninja turtles ii$/,''],[/teenage mutant ninja turtles iii$/,''],[/godzilla(?!.*ii$)/,''],[/godzilla/,''],
    [/giveaway day|free comic/,''],[/vr troopers/,'A related Saban series.']]}];
const crNorm=s=>String(s||'').toLowerCase().replace(/[–—]/g,'-').replace(/\s+/g,' ').trim();
/** Series in reading order: [{t, y, n, list:[{s, note, step}]}], with anything not in the list last. */
function crReadingOrder(series){ const used=new Set(), out=[]; let step=0;
  CR_ERAS.forEach(era=>{ const list=[]; era.s.forEach(([re,note])=>{ series.filter(s=>!used.has(s.id)&&re.test(crNorm(s.name))).sort((a,b)=>crNat(a.name,b.name)).forEach(s=>{ used.add(s.id); list.push({s,note}); }); });
    if(list.length) out.push({t:era.t,y:era.y,n:era.n,list}); });
  const rest=series.filter(s=>!used.has(s.id)); if(rest.length) out.push({t:'More stories',y:'',n:'',list:rest.map(s=>({s,note:''}))});
  out.forEach(e=>e.list.forEach(x=>{ x.step=++step; })); return out; }
/** Opens issue c inside host. opts: {onClose, onIssue(c) (another issue opened from the end screen), page, pass (admin passcode)}. */
function crMount(host,c0,opts={}){
  const set=Object.assign({two:'auto',fit:'screen'},store.get('cr-set',{}));
  host.innerHTML=`<div class="cr ui" tabindex="-1">
    <div class="cr-top">
      <button class="cr-b" data-cr="close" aria-label="Close the comic">${ico('x')}</button>
      <div class="cr-tt"><small class="cr-se"></small><b class="cr-ti"></b></div>
      <div class="cr-tools">
        <button class="cr-b cr-tx" data-cr="pages" aria-label="All pages" title="All pages">${ico('grid')}<span>Pages</span></button>
        <button class="cr-b cr-tx" data-cr="two" title="One page or two side by side"><i class="cr-ic2"></i><span class="cr-twl"></span></button>
        <button class="cr-b cr-tx" data-cr="fit" title="Fit the whole page, or the page width"><span class="cr-fitl"></span></button>
        <button class="cr-b cr-tx" data-cr="dir" title="Reading direction"><span class="cr-dirl"></span></button>
        <button class="cr-b cr-fsb" data-cr="full" aria-label="Full screen" title="Full screen">⛶</button>
      </div>
    </div>
    <div class="cr-stage"><div class="cr-view"></div></div>
    <button class="cr-side cr-prev" data-cr="prev" aria-label="Previous page">${ico('left')}</button><button class="cr-side cr-next" data-cr="next" aria-label="Next page">${ico('right')}</button>
    <div class="cr-bot">
      <span class="cr-pn"></span>
      <input class="cr-rng" type="range" min="1" max="1" value="1" aria-label="Page">
      <span class="cr-of"></span>
    </div>
    <div class="cr-grid" hidden><div class="cr-gh"><b>Pages</b><button class="cr-b" data-cr="pages" aria-label="Close the page list">${ico('x')}</button></div><div class="cr-gl"></div></div>
    <div class="cr-end" hidden></div>
    <div class="cr-note" hidden></div>
    <div class="cr-msg"><div><div class="cr-spin"></div><p>Opening the comic…</p></div></div>
  </div>`;
  const root=host.querySelector('.cr'), stage=root.querySelector('.cr-stage'), view=root.querySelector('.cr-view'), msg=root.querySelector('.cr-msg'),
    rng=root.querySelector('.cr-rng'), pn=root.querySelector('.cr-pn'), of=root.querySelector('.cr-of'), grid=root.querySelector('.cr-grid'), gl=root.querySelector('.cr-gl'),
    end=root.querySelector('.cr-end'), note=root.querySelector('.cr-note');
  const R={c:c0, pages:[], spreads:[], at:0, z:1, tx:0, ty:0, alive:true, hideT:0, noteT:0, saveT:0, rtl:false, key:0};
  const dpr=()=>Math.min(2.5,window.devicePixelRatio||1);
  const two=()=>set.two==='2'||(set.two==='auto'&&stage.clientWidth>=900&&stage.clientWidth>stage.clientHeight*1.15);
  const save=()=>store.set('cr-set',set);
  function paintTools(){ root.querySelector('.cr-twl').textContent=set.two==='auto'?'Auto':set.two==='2'?'2 pages':'1 page';
    root.querySelector('.cr-ic2').className='cr-ic2'+(two()?' on':'');
    root.querySelector('.cr-fitl').textContent=set.fit==='width'?'Fit width':'Fit page';
    root.querySelector('.cr-dirl').textContent=R.rtl?'Right to left':'Left to right';
    root.classList.toggle('rtl',R.rtl); root.classList.toggle('fitw',set.fit==='width'); }
  const say=(t,spin=true,extra='')=>{ msg.hidden=false; msg.innerHTML=`<div>${spin?'<div class="cr-spin"></div>':''}<p>${t}</p>${extra}</div>`; };

  /** Pages paired into spreads: the cover alone, then two at a time; a wide (already double) page always stands alone. */
  function makeSpreads(){ const n=R.pages.length, out=[]; if(!two()){ for(let i=0;i<n;i++) out.push([i]); return out; }
    let i=0; if(n) out.push([i++]);
    while(i<n){ const a=R.pages[i], b=R.pages[i+1]; if(a.r<1||!b||b.r<1){ out.push([i]); i++; } else { out.push([i,i+1]); i+=2; } }
    return out; }
  const spreadOf=p=>Math.max(0,R.spreads.findIndex(s=>s.includes(p)));
  const bucket=px=>CR_W.find(w=>w>=px)||CR_W[CR_W.length-1];
  /** Sizes the spread to the screen (or the screen width) and shows its pages, sharpest picture last. */
  function show(keepZoom){ if(!R.spreads.length) return; const s=R.spreads[R.at], W=stage.clientWidth, H=stage.clientHeight;
    const sum=s.reduce((a,i)=>a+1/R.pages[i].r,0); const pad=W<600?0:16;
    let h=set.fit==='width'?Math.min(W-pad*2,1500)/sum:Math.min(H-pad*2,(W-pad*2)/sum); h=Math.max(80,h);
    if(!keepZoom){ R.z=1; R.tx=0; R.ty=0; }
    const order=R.rtl?[...s].reverse():s;
    const key=++R.key;
    view.innerHTML=order.map(i=>{ const p=R.pages[i], w=Math.round(h/p.r); const low=CR_WARM.has(crImg(p.id,400))?crImg(p.id,400):'';
      return `<div class="cr-pg" data-i="${i}" style="width:${w}px;height:${Math.round(h)}px;${low?`background-image:url('${low}')`:''}"></div>`; }).join('');
    view.style.width=Math.round(sum*h)+'px'; view.style.height=Math.round(h)+'px';
    stage.classList.toggle('tall',set.fit==='width'&&h>H); if(!keepZoom) stage.scrollTop=0;
    sharpen(key); apply(); paintCount(); preload(); remember(); }
  function sharpen(key){ const need=bucket(Math.max(...[...view.children].map(el=>el.clientWidth))*dpr()*R.z);
    view.querySelectorAll('.cr-pg').forEach(el=>{ const p=R.pages[+el.dataset.i]; const url=crImg(p.id,need); const cur=el.querySelector('img');
      if(cur&&cur.dataset.w>=need) return;
      const im=new Image(); im.alt=''; im.decoding='async'; im.referrerPolicy='no-referrer'; im.dataset.w=need; im.draggable=false;
      im.onload=()=>{ if(!R.alive||key!==R.key&&!el.isConnected) return; im.classList.add('on'); CR_WARM.add(url); setTimeout(()=>{ el.querySelectorAll('img').forEach(x=>{ if(x!==im) x.remove(); }); },260); };
      im.onerror=()=>{ if(!el.querySelector('img.on')) el.classList.add('bad'); };
      im.src=url; el.appendChild(im); }); }
  function preload(){ const W=stage.clientWidth; const one=Math.min(W/(two()?2:1),1500)*dpr(); const w=bucket(one);
    [1,2,3,-1].forEach(k=>{ const s=R.spreads[R.at+k]; if(s) s.forEach(i=>crWarm(crImg(R.pages[i].id,w))); }); }
  function paintCount(){ const s=R.spreads[R.at], n=R.pages.length; const a=s[0]+1, b=s[s.length-1]+1;
    pn.textContent=a===b?`Page ${a}`:`Pages ${a}–${b}`; of.textContent=`of ${n}`; rng.max=n; rng.value=a;
    root.querySelector('.cr-prev').disabled=R.at===0; }
  function remember(){ clearTimeout(R.saveT); R.saveT=setTimeout(()=>{ const s=R.spreads[R.at]; if(!s) return; crSaveAt(R.c.id,s[0]);
      if(R.at===R.spreads.length-1) crMarkRead(R.c.id); },400); }
  function go(k){ if(!R.spreads.length) return; if(!end.hidden){ end.hidden=true; if(k>=R.spreads.length) return; }
    if(k>=R.spreads.length){ return showEnd(); } k=Math.max(0,Math.min(R.spreads.length-1,k)); if(k===R.at&&view.children.length) return; R.at=k; show(); }
  const next=()=>{ if(set.fit==='width'&&R.z===1&&stage.scrollTop+stage.clientHeight<stage.scrollHeight-8){ stage.scrollBy({top:stage.clientHeight*.85,behavior:'smooth'}); return; } go(R.at+1); };
  const prev=()=>{ if(!end.hidden){ end.hidden=true; return; } go(R.at-1); };
  const gotoPage=p=>go(spreadOf(Math.max(0,Math.min(R.pages.length-1,p))));

  /* ---- zoom and pan ---- */
  function clamp(){ const W=stage.clientWidth, H=stage.clientHeight, cw=view.offsetWidth*R.z, ch=view.offsetHeight*R.z;
    const mx=Math.max(0,(cw-W)/2+8), my=Math.max(0,(ch-H)/2+8); R.tx=Math.max(-mx,Math.min(mx,R.tx)); R.ty=Math.max(-my,Math.min(my,R.ty)); }
  function apply(){ if(R.z<=1.01){ R.z=1; R.tx=0; R.ty=0; } else clamp(); view.style.transform=R.z===1?'':`translate(${R.tx}px,${R.ty}px) scale(${R.z})`; root.classList.toggle('zoomed',R.z>1); }
  /** Zoom to z keeping the point (x, y) on screen where it is. */
  function zoomAt(z,x,y){ const r=stage.getBoundingClientRect(); const cx=x-(r.left+r.width/2), cy=y-(r.top+r.height/2);
    z=Math.max(1,Math.min(5,z)); R.tx=cx-(cx-R.tx)*(z/R.z); R.ty=cy-(cy-R.ty)*(z/R.z); R.z=z; apply(); clearTimeout(R.zT); R.zT=setTimeout(()=>sharpen(R.key),180); }

  /* ---- pointer: tap the edges to turn, swipe, double tap / double click to zoom, drag to pan, pinch ---- */
  const P=new Map(); let g=null, lastTap=0, tapT=0;
  stage.addEventListener('pointerdown',e=>{ if(e.button>0) return; P.set(e.pointerId,{x:e.clientX,y:e.clientY}); try{ stage.setPointerCapture(e.pointerId); }catch(_){}
    if(P.size===2){ const [a,b]=[...P.values()]; g={pinch:true,d:Math.hypot(a.x-b.x,a.y-b.y),z:R.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}; return; }
    g={x:e.clientX,y:e.clientY,t:Date.now(),tx:R.tx,ty:R.ty,moved:false}; });
  stage.addEventListener('pointermove',e=>{ if(!P.has(e.pointerId)||!g) return; P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(g.pinch&&P.size===2){ root.classList.add('drag'); const [a,b]=[...P.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(g.d>10) zoomAt(g.z*d/g.d,g.mx,g.my); return; }
    const dx=e.clientX-g.x, dy=e.clientY-g.y; if(Math.abs(dx)+Math.abs(dy)>8){ g.moved=true; root.classList.add('drag'); }
    if(R.z>1&&g.moved){ R.tx=g.tx+dx; R.ty=g.ty+dy; apply(); }
    else if(g.moved&&e.pointerType!=='mouse'&&Math.abs(dx)>Math.abs(dy)) view.style.transform=`translateX(${dx*.35}px)`; });
  const up=e=>{ if(!P.has(e.pointerId)) return; P.delete(e.pointerId); root.classList.remove('drag'); if(!g) return;
    if(g.pinch){ if(!P.size) g=null; return; }
    const dx=e.clientX-g.x, dy=e.clientY-g.y, dt=Date.now()-g.t, was=g; g=null;
    if(R.z===1) view.style.transform='';
    if(e.type==='pointercancel') return;
    if(was.moved){ if(R.z===1&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2&&dt<900) ((dx<0)!==R.rtl?next:prev)(); return; }
    tap(e.clientX,e.clientY,e.pointerType); };
  stage.addEventListener('pointerup',up); stage.addEventListener('pointercancel',up);
  /** Edges turn the page; the middle shows or hides the bars, and a double tap there zooms. */
  function tap(x,y,type){ const r=stage.getBoundingClientRect(), fx=(x-r.left)/r.width; const edge=R.z===1?(fx<.28?'l':fx>.72?'r':''):'';
    if(edge){ clearTimeout(tapT); lastTap=0; ((edge==='r')!==R.rtl?next:prev)(); return; }
    const now=Date.now();
    if(now-lastTap<320){ clearTimeout(tapT); lastTap=0; if(R.z>1){ R.z=1; apply(); } else zoomAt(2.5,x,y); return; }
    lastTap=now; clearTimeout(tapT); tapT=setTimeout(()=>{ lastTap=0; toggleUi(); },type==='mouse'?260:300); }
  stage.addEventListener('wheel',e=>{ if(e.ctrlKey||R.z>1){ e.preventDefault(); if(e.ctrlKey) zoomAt(R.z*Math.exp(-e.deltaY*.01),e.clientX,e.clientY); else { R.tx-=e.deltaX; R.ty-=e.deltaY; apply(); } } },{passive:false});

  /* ---- bars ---- */
  const fine=()=>!!(window.matchMedia&&matchMedia('(pointer:fine)').matches);
  function showUi(){ root.classList.add('ui'); clearTimeout(R.hideT); R.hideT=setTimeout(()=>{ if(!root.querySelector('.cr-top:hover,.cr-bot:hover,.cr-side:hover')&&grid.hidden&&end.hidden) root.classList.remove('ui'); },fine()?2600:4000); }
  function toggleUi(){ if(root.classList.contains('ui')){ root.classList.remove('ui'); clearTimeout(R.hideT); } else showUi(); }
  root.addEventListener('mousemove',e=>{ if(e.movementX||e.movementY) showUi(); });

  function openGrid(){ if(!grid.hidden){ grid.hidden=true; return; } const cur=R.spreads[R.at]||[];
    gl.innerHTML=R.pages.map((p,i)=>`<button class="cr-gp${cur.includes(i)?' on':''}" data-gp="${i}" aria-label="Page ${i+1}"><span style="aspect-ratio:1/${p.r}"><img src="${crImg(p.id,400)}" alt="" loading="lazy" referrerpolicy="no-referrer"></span><small>${i+1}</small></button>`).join('');
    grid.hidden=false; const on=gl.querySelector('.on'); if(on) on.scrollIntoView({block:'center'}); }
  function showEnd(){ const sid=R.c.s, l=crIssues(sid), k=l.findIndex(x=>x.id===R.c.id), nx=k>=0?l[k+1]:null; crMarkRead(R.c.id); crSaveAt(R.c.id,0);
    end.innerHTML=`<div class="cr-endc"><small>The end of</small><b>${esc(crName(R.c))}</b>
      ${nx?`<button class="cr-nx" data-cr="nextissue">${crCoverId(nx)?`<img src="${esc(crCover(nx,400))}" alt="" referrerpolicy="no-referrer">`:''}<span><small>Next issue</small><b>${esc(crName(nx))}</b></span>${ico('right')}</button>`:`<p>${l.length>1?'That was the last issue in this series.':''}</p>`}
      <div class="cr-endb"><button class="cr-b cr-tx" data-cr="again">Read it again</button><button class="cr-b cr-tx" data-cr="close">${opts.closeLabel||'Back to the series'}</button></div></div>`;
    end.hidden=false; showUi(); end.dataset.next=nx?nx.id:''; }
  async function load(c,page){ R.c=c; end.hidden=true; grid.hidden=true; view.innerHTML=''; R.pages=[]; R.spreads=[];
    const sr=crSeries(c.s); root.querySelector('.cr-se').textContent=sr?sr.name:''; root.querySelector('.cr-ti').textContent=crName(c);
    R.rtl=!!store.get('cr-rtl-'+c.s,false); paintTools(); say('Opening the comic…');
    try{ const r=await crLoadPages(c,opts.pass); if(!R.alive||R.c!==c) return;
      R.pages=crPages(r.pg).map(p=>p||{id:'',r:1.538}); if(!R.pages.length) throw new Error('it has no pages yet');
      msg.hidden=true; R.spreads=makeSpreads();
      let at=Math.round(+page||0)-1; let back=false;
      if(!(at>=0&&at<R.pages.length)){ const saved=crAt(c.id); at=saved>0&&saved<R.pages.length?saved:0; back=at>0; }
      R.at=spreadOf(at); show(); showUi(); root.focus({preventScroll:true});
      if(back){ note.innerHTML=`<span>Back at page ${at+1}</span><button class="cr-b cr-tx" data-cr="start">Start from the cover</button>`; note.hidden=false; clearTimeout(R.noteT); R.noteT=setTimeout(()=>{ note.hidden=true; },7000); }
    }catch(e){ if(!R.alive) return; say(`This comic could not open${e&&e.message?': '+esc(e.message):''}.`,false,`<p><button class="cr-b cr-tx" data-cr="retry">Try again</button></p>`); } }
  function relayout(){ if(!R.pages.length) return; const p=(R.spreads[R.at]||[0])[0]; R.spreads=makeSpreads(); R.at=spreadOf(p); show(); }
  const full=()=>{ const fsEl=document.fullscreenElement||document.webkitFullscreenElement;
    if(fsEl){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    if(root.classList.contains('fs')){ root.classList.remove('fs'); return; }
    const req=root.requestFullscreen||root.webkitRequestFullscreen; if(req){ const p=req.call(root); if(p&&p.catch) p.catch(()=>root.classList.add('fs')); } else root.classList.add('fs'); };
  root.addEventListener('click',e=>{ const gp=e.target.closest('[data-gp]'); if(gp){ grid.hidden=true; return gotoPage(+gp.dataset.gp); }
    const b=e.target.closest('[data-cr]'); if(!b) return; const a=b.dataset.cr; showUi();
    if(a==='close') return opts.onClose&&opts.onClose();
    if(a==='prev') return (R.rtl?next:prev)(); if(a==='next') return (R.rtl?prev:next)();
    if(a==='pages') return openGrid();
    if(a==='two'){ set.two=set.two==='auto'?(two()?'1':'2'):set.two==='2'?'1':'auto'; save(); paintTools(); return relayout(); }
    if(a==='fit'){ set.fit=set.fit==='width'?'screen':'width'; save(); paintTools(); return show(); }
    if(a==='dir'){ R.rtl=!R.rtl; store.set('cr-rtl-'+R.c.s,R.rtl||null); paintTools(); return show(); }
    if(a==='full') return full();
    if(a==='start'){ note.hidden=true; return go(0); }
    if(a==='again'){ end.hidden=true; R.at=-1; return go(0); }
    if(a==='retry'){ delete CR_CACHE[R.c.id]; return load(R.c); }
    if(a==='nextissue'){ const nx=crById(end.dataset.next); if(nx){ load(nx,1); opts.onIssue&&opts.onIssue(nx); } } });
  rng.addEventListener('input',()=>{ pn.textContent='Page '+rng.value; });
  rng.addEventListener('change',()=>gotoPage(+rng.value-1));
  /** Keys: arrows / Page Up / Page Down / Space turn pages, Home / End, + and − zoom, 0 resets, F full screen, Escape closes. */
  const key=e=>{ if(e.target&&e.target.matches&&e.target.matches('input:not([type=range]),textarea,select')) return false;
    const k=e.key, fwd=R.rtl?'ArrowLeft':'ArrowRight', back=R.rtl?'ArrowRight':'ArrowLeft';

/* ===================== PDF reader: streams big books a piece at a time (shared by the full and phone sites) ===================== */
const RD_PART=2*1024*1024, RD_WHOLE=12*1024*1024;
let RD_LIB=null;
async function rdLib(){ if(RD_LIB) return RD_LIB; const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if(!window.pdfjsLib) await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=base+'pdf.min.js'; s.onload=res; s.onerror=()=>rej(new Error('The PDF reader could not load. Check your connection.')); document.head.appendChild(s); });

  if(!lib.GlobalWorkerOptions.workerSrc){ try{ const code=await (await fetch(base+'pdf.worker.min.js')).text(); lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'text/javascript'})); }catch(e){ lib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; } }

const rdBytes=b=>{ const s=atob(b); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; };
/** Reads byte ranges of a site file through the archive, six pieces at a time. */
function rdFetcher(id){ let active=0; const q=[];
  const run=()=>{ while(active<6&&q.length){ const j=q.shift(); active++; api('getFileRange',id,j.s,j.e).then(r=>{ if(r&&r.size) j.size=r.size; j.res(rdBytes(r.data)); },j.rej).finally(()=>{ active--; run(); }); } };
  const one=(s,e)=>new Promise((res,rej)=>{ q.push({s,e,res,rej}); run(); });
  return async (begin,end,onPart)=>{ const parts=[]; for(let s=begin;s<end;s+=RD_PART) parts.push(one(s,Math.min(end,s+RD_PART)).then(b=>{ onPart&&onPart(b.length); return b; }));
    const bufs=await Promise.all(parts); if(bufs.length===1) return bufs[0];
    const out=new Uint8Array(bufs.reduce((a,b)=>a+b.length,0)); let o=0; bufs.forEach(b=>{ out.set(b,o); o+=b.length; }); return out; }; }

/* Fast pages: books whose pages were saved as pictures open instantly and show each page straight from Google's image servers. */
const RD_IMG_W=1600;
/** The saved page pictures of a book: [{id, r: height/width} | null] (null = that page has no picture yet). */
const rdPages=f=>f&&f.pg?String(f.pg).split(',').map(s=>{ if(!s) return null; const k=s.indexOf('~'); return {id:k<0?s:s.slice(0,k), r:k<0?0:+s.slice(k+1)||0}; }):[];

const rdW=px=>px<=1100?1000:RD_IMG_W;
const rdImgUrl=window.RD_IMG_URL||((id,w)=>'https://lh3.googleusercontent.com/d/'+id+'=w'+w);
const RD_WARM=new Set();

function rdWarm(f,n=3){ const pg=rdPages(f); if(!pg.length) return; const vw=window.innerWidth||1000;
  const css=Math.min(980,vw>1100?vw-470:vw-24), w=rdW(css*Math.min(2,window.devicePixelRatio||1));
  let k=0; try{ k=+localStorage.getItem('rd-at-'+f.id)||0; }catch(e){}
  const start=k>1&&k<=pg.length?k-1:0; pg.slice(start,start+n).forEach(p=>p&&rdPreload(rdImgUrl(p.id,w))); }

/** Mounts a reader for file f inside host. opts: {onClose, full:true|false, page}. Returns {destroy, key}. */
function rdMount(host,f,opts={}){

      <div class="rd-pg"><button class="rd-b" data-rd="prev" aria-label="Previous page">${ico('left')}</button><input class="rd-in" inputmode="numeric" aria-label="Page number" value="1"><span class="rd-of">of …</span><button class="rd-b" data-rd="next" aria-label="Next page">${ico('right')}</button></div>
      <div class="rd-zm"><button class="rd-b" data-rd="out" aria-label="Zoom out">−</button><button class="rd-b rd-zv" data-rd="fit" title="Fit the page width">100%</button><button class="rd-b" data-rd="in" aria-label="Zoom in">+</button></div>

    </div><div class="rd-scroll" tabindex="0"><div class="rd-pages"></div><div class="rd-msg"><div><div class="rd-spin"></div><p>Opening the book…</p></div></div></div><div class="rd-note" hidden></div><aside class="rd-qa" hidden aria-label="Add to a character"></aside></div>`;
  const root=host.querySelector('.rd'), sc=root.querySelector('.rd-scroll'), box=root.querySelector('.rd-pages'), msg=root.querySelector('.rd-msg'), inp=root.querySelector('.rd-in'), of=root.querySelector('.rd-of'), zv=root.querySelector('.rd-zv'), note=root.querySelector('.rd-note');
  const qaBox=root.querySelector('.rd-qa'), qaBtn=root.querySelector('.rd-qab');
  const pg=rdPages(f), fast=pg.some(Boolean);
  const R={doc:null, docP:null, n:0, zoom:1, fitW:800, alive:true, tasks:new Map(), cur:1, queue:[], active:0, pt:0, st:0, tg:0, tgT:0};

      if(d<600){ if(needVector(el)){ if(+el.dataset.s!==want_(el)&&!el.dataset.busy) todo.push(el); } else if(el.dataset.s) unrender(el); }

  const ro=window.ResizeObserver?new ResizeObserver(()=>{ if(R.n) layout(true); }):null; ro&&ro.observe(sc);

  root.addEventListener('click',e=>{ const b=e.target.closest('[data-rd]'); if(!b) return; const a=b.dataset.rd;

}

/* ---- Making fast pages (admin): draw every page once and save it as a picture next to the book ---- */
/** Draws page i of doc as a JPEG data URL 1600 pixels wide. Uses print mode so it keeps going in a background tab. */
async function rdPagePicture(doc,i){ const page=await doc.getPage(i); const v1=page.getViewport({scale:1});

/* ===================== RPG quick add: put things from the books onto a character (shared by the full and phone sites) ===================== */
/* The list of addable things lives in rpgadd.json next to the site: {books:{fileId:[item…]}}.
   item: {p:first page, q:last page, k:kind, n:name, d:short summary, f:{fields to fill}} */
let QA_DATA=null, QA_LOADING=null;
const QA_KINDS={origin:'Origin',role:'Ranger role',influence:'Influence',hangup:'Hang-up',power:'Power',perk:'Perk',bond:'Background bond',
  weapon:'Weapon',armor:'Armor or shield',gear:'Equipment',zord:'Zord',mega:'Megazord',zordfeat:'Zord feature',language:'Language',note:'Note'};
function qaLoad(){ if(QA_DATA) return Promise.resolve(QA_DATA); if(QA_LOADING) return QA_LOADING;
  const v=(typeof BOOT!=='undefined'&&BOOT.v)||Date.now().toString(36);
  let url; try{ url=new URL('rpgadd.json?v='+v,(typeof BOOT!=='undefined'&&BOOT.url)||location.href).href; }catch(e){ url='rpgadd.json?v='+v; }
  return QA_LOADING=fetch(url).then(r=>{ if(!r.ok) throw new Error('not found'); return r.json(); })
    .then(d=>QA_DATA=d).catch(e=>{ QA_LOADING=null; throw e; }); }
const qaItemsFor=(fid,page)=>((QA_DATA&&QA_DATA.books[fid])||[]).filter(it=>page>=it.p&&page<=(it.q||it.p));
const qaHas=fid=>!!(QA_DATA&&QA_DATA.books[fid]&&QA_DATA.books[fid].length);
/** Pages of a book that have something to add (for the page markers). */
const qaPages=fid=>{ const s=new Set(); ((QA_DATA&&QA_DATA.books[fid])||[]).forEach(it=>{ for(let p=it.p;p<=(it.q||it.p);p++) s.add(p); }); return s; };

/* ---- characters: the same list the character builder keeps in this browser ---- */
const qaStore={ get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
function qaChars(){ return (qaStore.get('gcg-chars',[])||[]).filter(c=>c&&typeof c==='object'); }
function qaBlank(){ if(typeof PRSHEET!=='undefined') return PRSHEET.blank();
  const zsk=()=>({brawn:0,cond:0,might:0,drive:0,init:0,custom:0});
  return {name:'',pronouns:'',origin:'',role:'',level:'1',description:'',languages:'',influences:'',hangups:'',personalPower:'',movement:'',health:'',damage:0,
    attacks:[0,1,2,3,4].map(()=>({name:'',range:'',attack:'',effects:'',notes:''})),powers:'',perks:'',bonds:'',
    weapons:[0,1,2].map(()=>({name:'',range:'',hands:'',traits:'',attack:'',effects:'',alt:''})),armor:[0,1,2].map(()=>({type:'',desc:'',effect:'',traits:''})),
    zord:{name:'',str:'',spd:'',tough:'',eva:'',size:'',move:'',health:'',damage:0,skills:zsk(),customName:'',notes:'',features:'',attacks:[0,1].map(()=>({weapon:'',range:'',effects:''}))},
    inventory:'',notes:'',mega:{name:'',str:'',spd:'',tough:'',eva:'',size:'',move:'',health:['','','','','',''],damage:0,skills:zsk(),customName:'',notes:'',features:'',
      attacks:[0,1,2,3].map(()=>({weapon:'',range:'',effects:''})),zords:[0,1,2,3,4,5].map(()=>({name:'',ranger:'',color:'',health:'',notes:'',traits:''}))},skillMarks:'upto'}; }
function qaFull(c){ const b=qaBlank(); const merge=(t,s)=>{ if(Array.isArray(t)) return t.map((v,i)=>s&&s[i]!==undefined?merge(v,s[i]):v);
    if(t&&typeof t==='object'){ const o={}; Object.keys(t).forEach(k=>{ o[k]=s&&s[k]!==undefined?merge(t[k],s[k]):t[k]; }); return o; }
    return s===undefined||s===null?t:(typeof t==='number'?(+s||0):String(s)); };
  const o=merge(b,c||{}); if(c&&c.g&&typeof c.g==='object') o.g=c.g; o.id=(c&&c.id)||Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); o.updated=(c&&c.updated)||Date.now(); return o; }
const qaName=c=>(c.name||'').trim()||'Unnamed Ranger';
function qaCurrent(){ const l=qaChars(); const id=qaStore.get('gcg-char-cur',''); return l.find(c=>c.id===id)||l[0]||null; }

/* ---- what adding does to the sheet ---- */
const qaLine=(text,line)=>{ const t=String(text||'').replace(/\s+$/,''); return t?t+'\n'+line:line; };
const qaHasLine=(text,name)=>String(text||'').split('\n').some(l=>l.trim().toLowerCase().startsWith(name.toLowerCase()));
/** Where an item lands: [label, already there?]. */
function qaWhere(c,it){ const n=it.n, k=it.k;
  if(k==='origin') return ['Origin',(c.origin||'').toLowerCase()===n.toLowerCase()];
  if(k==='role') return ['Role',(c.role||'').toLowerCase()===n.toLowerCase()];
  if(k==='weapon') return ['Weapons',c.weapons.some(w=>w.name.toLowerCase()===n.toLowerCase())||qaHasLine(c.inventory,n)];
  if(k==='armor') return ['Armor',c.armor.some(a=>a.type.toLowerCase()===n.toLowerCase())||qaHasLine(c.inventory,n)];
  if(k==='zord') return ['Zord',(c.zord.name||'').toLowerCase()===n.toLowerCase()];
  if(k==='mega') return ['Megaform',(c.mega.name||'').toLowerCase()===n.toLowerCase()];
  if(k==='zordfeat') return ['Zord features',qaHasLine(c.zord.features,n)];
  const fld={influence:['influences','Influences'],hangup:['hangups','Hang-ups'],power:['powers','Powers'],perk:['perks','Perks'],bond:['bonds','Background bonds'],
    gear:['inventory','Inventory'],language:['languages','Languages'],note:['notes','Notes']}[k]||['notes','Notes'];
  return [fld[1],qaHasLine(c[fld[0]],n)]; }
/** Adds the item to character c (changes c). Returns a sentence saying where it went. */
function qaApply(c,it){ const f=it.f||{}, n=it.n, k=it.k, line=f.line||(it.d?n+': '+it.d:n);
  const put=(o,vals)=>Object.keys(vals).forEach(key=>{ if(vals[key]!==undefined&&vals[key]!==null&&key in o) o[key]=String(vals[key]); });
  if(k==='origin'){ c.origin=n; const bits=['set as the Origin'];
    if(f.health&&!String(c.health).trim()){ c.health=f.health; bits.push('starting Health '+f.health); }
    if(f.movement&&!String(c.movement).trim()){ c.movement=f.movement; bits.push('Movement '+f.movement); }
    if(f.perk&&!qaHasLine(c.perks,f.perk.split(' (')[0])){ c.perks=qaLine(c.perks,f.perk); bits.push('its benefit added to Perks'); }
    if(f.ess) c.notes=qaLine(c.notes,'Origin ('+n+'): '+f.ess);
    return bits.join(', '); }
  if(k==='influence'){ if(!qaHasLine(c.influences,n)) c.influences=qaLine(c.influences,line); if(f.hangup&&!c.hangups.includes(f.hangup)) c.hangups=qaLine(c.hangups,f.hangup);
    return 'added to Influences'+(f.hangup?' and its hang-up to Hang-ups':''); }
  if(k==='zordfeat'){ c.zord.features=qaLine(c.zord.features,line); return 'added to the Zord’s features'; }
  if(k==='role'){ c.role=n; return 'set as the Role'; }
  if(k==='weapon'){ const row=c.weapons.find(w=>!w.name.trim()); if(row){ put(row,Object.assign({name:n},f.row||{})); return 'added to Weapons'; }
    c.inventory=qaLine(c.inventory,line); return 'added to Inventory (the three weapon rows are full)'; }
  if(k==='armor'){ const row=c.armor.find(a=>!a.type.trim()); if(row){ put(row,Object.assign({type:n},f.row||{})); return 'added to Armor'; }
    c.inventory=qaLine(c.inventory,line); return 'added to Inventory (the three armor rows are full)'; }
  if(k==='zord'||k==='mega'){ const z=k==='zord'?c.zord:c.mega; const was=(z.name||'').trim();
    put(z,Object.assign({name:n},f.stats||{}));
    if(f.health!==undefined){ const hv=Array.isArray(f.health)?f.health:[f.health];
      if(Array.isArray(z.health)) z.health=z.health.map((h,i)=>hv[i]!==undefined?String(hv[i]):''); else z.health=hv.join('/'); }
    if(f.features) z.features=f.features;
    if(f.customName!==undefined) z.customName=String(f.customName||'');
    if(f.skills) Object.keys(f.skills).forEach(s=>{ if(s in z.skills) z.skills[s]=+f.skills[s]||0; });
    if(f.attacks){ z.attacks=z.attacks.map((a,i)=>f.attacks[i]?Object.assign({weapon:'',range:'',effects:''},f.attacks[i]):{weapon:'',range:'',effects:''}); }
    return (k==='zord'?'set as the Zord':'set as the Megaform')+(was&&was.toLowerCase()!==n.toLowerCase()?' (replacing '+was+')':''); }
  const fld={influence:'influences',hangup:'hangups',power:'powers',perk:'perks',bond:'bonds',gear:'inventory',language:'languages',note:'notes'}[k]||'notes';
  c[fld]=qaLine(c[fld],k==='language'?n:line); return 'added to '+qaWhere(c,it)[0]; }
/** Adds it to the chosen character (or a new one) and saves. Returns {name, said}. */
function qaAdd(it,charId){ let list=qaChars().map(qaFull); let c=list.find(x=>x.id===charId);
  if(!c){ c=qaFull(null); list.push(c); }
  const said=qaApply(c,it); c.updated=Date.now(); qaStore.set('gcg-chars',list); qaStore.set('gcg-char-cur',c.id);
  if(typeof CB!=='undefined'&&CB){ CB.list=null; CB.ch=null; }      // the builder reloads from storage next time it opens
  return {name:qaName(c), said, id:c.id}; }

/* ---- the tray inside the book reader ---- */
function qaSummary(it){ const f=it.f||{}, bits=[];
  if(f.row){ const r=f.row; ['range','hands','traits','attack','effects','effect','desc'].forEach(k=>{ if(r[k]) bits.push((k==='desc'?'':k[0].toUpperCase()+k.slice(1)+' ')+r[k]); }); }
  if(f.stats){ const s=f.stats, L={str:'Str',spd:'Spd',tough:'Tough',eva:'Eva',size:'Size',move:'Move'}; Object.keys(L).forEach(k=>{ if(s[k]) bits.push(L[k]+' '+s[k]); }); }
  return bits.length?bits.join(' · '):(it.d||''); }
function qaTrayHTML(fid,page){ const items=qaItemsFor(fid,page), list=qaChars(), cur=qaCurrent();
  const pick=`<label class="qa-who"><span>Add to</span><select class="qa-sel" data-qa="who">${list.map(c=>`<option value="${esc(c.id)}"${cur&&c.id===cur.id?' selected':''}>${esc(qaName(c))}</option>`).join('')}<option value="">New character</option></select></label>`;
  const c=cur?qaFull(cur):null;
  const rows=items.map((it,i)=>{ const w=c?qaWhere(c,it):[qaWhere(qaFull(null),it)[0],false];
    return `<div class="qa-it"><div class="qa-tx"><small>${esc(QA_KINDS[it.k]||it.k)}${it.q&&it.q!==it.p?` · pages ${it.p}–${it.q}`:''}</small><b>${esc(it.n)}</b>${qaSummary(it)?`<span>${esc(qaSummary(it))}</span>`:''}</div>
      <button class="rd-b qa-add${w[1]?' done':''}" data-qa="add" data-i="${i}" title="${w[1]?'Already on the sheet. Add again':'Add to '+esc(w[0])}">${w[1]?'Added':'Add'}</button></div>`; }).join('');
  return `<div class="qa-h"><b>Add to a character</b><button class="rd-b" data-qa="close" aria-label="Close">${ico('x')}</button></div>${pick}
    <div class="qa-pg">Page ${page}</div><div class="qa-list">${rows||'<p class="qa-none">Nothing to add from this page. Turn the page, or look for the pages that describe origins, powers, gear and Zords.</p>'}</div>
    <a class="qa-open" href="${esc((typeof BOOT!=='undefined'&&BOOT.url?BOOT.url+'?view=full&':'./?')+'t=builder')}" target="_top">Open the character builder</a>`; }
/* ===================== end of RPG quick add ===================== */

const cmSortedM=()=>[...(S.comicSeries||[])].sort((a,b)=>(a.order||0)-(b.order||0)||crNat(a.name,b.name)).filter(s=>crIssues(s.id).length);
const cmCovM=c=>{ const u=crCover(c,400); return `<span class="cmc" style="aspect-ratio:1/${Math.min(1.8,Math.max(1.2,crCoverR(c)))}">${u?`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}`; };
function cmTileM(s,ro){ const l=crIssues(s.id), read=crRead(), n=l.filter(c=>read.has(c.id)).length;
  return `<button class="cms" data-cser="${s.id}">${cmCovM(l[0])}${ro?`<span class="cmst${ro.step===1?' first':''}">${ro.step===1?'Start here':'#'+ro.step}</span>`:''}</span><b>${esc(s.name)}</b>${ro&&ro.note?`<small class="cmnote">${esc(ro.note)}</small>`:''}<small>${esc([plural(l.length,'issue','issues'),s.years].filter(Boolean).join(' · '))}${n?' · '+n+' read':''}</small></button>`; }
function cmIssueM(c,withSeries){ const read=crRead().has(c.id), at=crAt(c.id), pct=c.p&&at&&!read?Math.round((at+1)/c.p*100):0, sr=withSeries?crSeries(c.s):null;
  return `<button class="cmi${read?' read':''}" data-comic="${c.id}">${cmCovM(c)}${read?`<span class="cmd">${ico('check')}</span>`:''}${pct?`<span class="cmp"><i style="width:${pct}%"></i></span>`:''}</span>
    ${sr?`<small>${esc(sr.name)}</small>`:''}<b>${c.n?`<em>${esc(crNum(c))}</em> `:''}${esc(c.t)}</b><small>${esc([c.y,c.p?plural(c.p,'page','pages'):''].filter(Boolean).join(' · '))}${pct?' · page '+(at+1):''}</small></button>`; }
function renderComicsM(m){ const q=S.q.trim().toLowerCase(), all=cmSortedM();
  const hay=s=>[s.name,s.publisher,s.years,s.description,...crIssues(s.id).map(c=>c.t+' '+c.n)].join(' ').toLowerCase();
  const l=all.filter(s=>!q||q.split(/\s+/).every(t=>hay(s).includes(t))), read=crRead();
  const going=(S.comics||[]).filter(c=>!c.st&&crAt(c.id)>0&&!read.has(c.id)&&crSeries(c.s));
  m.innerHTML=`<section class="screen"><div class="rpg-head"><button class="back" data-back style="margin:-4px 0 10px">${ico('left')}Cards</button><small>Read online</small><h1>Comics</h1><p>Power Rangers comics in reading order. Tap a series to start; swipe or tap the edges of a page to turn it.</p></div>
    ${going.length&&!q?`<div class="bkg"><h2>Continue reading</h2><div class="cmrow">${going.slice(0,8).map(c=>cmIssueM(c,true)).join('')}</div></div>`:''}
    ${l.length?crReadingOrder(l).map((e,k)=>`<div class="bkg"><h2>${k+1}. ${esc(e.t)}${e.y?' · '+esc(e.y):''}</h2>${e.n?`<p class="cmen">${esc(e.n)}</p>`:''}<div class="cmgrid">${e.list.map(x=>cmTileM(x.s,x)).join('')}</div></div>`).join(''):`<div class="empty"><b>${all.length?'No matches':'No comics yet'}</b>${all.length?'Try another search.':'Check back soon.'}</div>`}</section>`; }
function renderCserM(m,s){ if(!s){ S.sub=null; return render(); } const l=crIssues(s.id), q=S.q.trim().toLowerCase(), read=crRead();
  const shown=q?l.filter(c=>q.split(/\s+/).every(t=>(c.t+' '+c.n+' '+c.y).toLowerCase().includes(t))):l, k=crContinue(s.id), n=l.filter(c=>read.has(c.id)).length;
  const yrs=s.years||(()=>{ const ys=l.map(c=>parseInt(c.y)).filter(Boolean); if(!ys.length) return ''; const a=Math.min(...ys), b=Math.max(...ys); return a===b?String(a):a+'–'+b; })();
  const go=k?`<button class="btn primary" data-comic="${k.c.id}">${ico('book')}${k.mid?'Continue '+esc(crNum(k.c)||'reading'):k.started?'Read '+esc(crNum(k.c)||'the next issue'):'Start reading'}</button>`:l.length?`<button class="btn primary" data-comic="${l[0].id}">${ico('book')}Read again</button>`:'';

    <span class="dkind">${esc([s.publisher,yrs].filter(Boolean).join(' · ')||'Comic series')}</span><h1>${esc(s.name)}</h1>${s.description?`<p>${esc(s.description)}</p>`:''}
    <div class="acts">${go}</div><p class="cmn">${plural(l.length,'issue','issues')}${n?` · ${n} read`:''}</p></div>
    ${shown.length?`<div class="cmgrid" style="padding-top:6px">${shown.map(c=>cmIssueM(c)).join('')}</div>`:`<div class="empty"><b>${l.length?'No matches':'No issues yet'}</b>${l.length?'Try another search.':'Check back soon.'}</div>`}<div style="height:16px"></div></section>`; }

/** The book reader, full screen; the phone's back button closes it. */

  const rd=rdMount(el,f,{onClose:()=>popLayer(),page});
  pushLayer(()=>{ rd.destroy(); el.remove(); document.body.style.overflow=''; }); }
function renderSets(m){
  m.innerHTML=`<section class="screen"><div class="sh"><h1>Sets</h1><span class="sub">${plural(S.collections.length,'collection','collections')}</span></div>${S.collections.length?`<div class="rows">${S.collections.map(c=>{ const cs=cardsIn(c.id); const cov=S.cards.find(x=>x.id===c.cover)||cs[0];

function renderSet(m,c){ if(!c){ S.sub=null; return render(); } const list=cardList(cardsIn(c.id)); CUR=list;

function totalsHTML(l){ const t=l.reduce((a,x)=>{ const k=x.copies||1; a.s+=(x.shields||0)*k; a.d+=(x.dice||0)*k; a.h+=(x.hits||0)*k; return a; },{s:0,d:0,h:0}); if(!t.s&&!t.d&&!t.h) return '';
  return `<div class="totals">${t.s?`<span><i class="gi sh">s</i>${plural(t.s,'shield','shields')}</span>`:''}${t.d?`<span><i class="gi">d</i>${plural(t.d,'die','dice')}</span>`:''}${t.h?`<span><i class="gi">h</i>${plural(t.h,'hit','hits')}</span>`:''}</div>`; }

/* ---------------- main events ---------------- */
$('#main').addEventListener('click',e=>{
  const t=e.target.closest('button,[data-i]'); if(!t) return;
  if(t.dataset.ctype!==undefined){ buzz(); S.ctype=t.dataset.ctype; S.dtype=''; return render(); }
  if(t.dataset.dkf!==undefined){ buzz(); S.dk=t.dataset.dkf; return render(); }
  if(t.dataset.fcat!==undefined){ buzz(); S.fcat=t.dataset.fcat; return render(); }
  if(t.dataset.file) return openFileSheet(t.dataset.file);
  if(t.dataset.trules) return openTypeRules(t.dataset.trules);
  if(t.dataset.rules!==undefined){ S.fcat=''; return openSub('rules',''); }
  if(t.dataset.scens!==undefined){ S.scat=''; return openSub('scenarios',''); }
  if(t.dataset.exps!==undefined) return openSub('exps','');
  if(t.dataset.comicsm!==undefined) return openSub('comics','');
  if(t.dataset.cser) return openSub('cser',t.dataset.cser);
  if(t.dataset.comic) return openComicM(t.dataset.comic);
  if(t.dataset.xown){ buzz(); ownToggle(t.dataset.xown); const y=window.scrollY; render(); window.scrollTo({top:y}); return toast(OWN.has(t.dataset.xown)?'Marked as owned':'Removed from your boxes'); }
  if(t.dataset.xgo) return openSub('exp',t.dataset.xgo);
  if(t.dataset.scardOpen){ const l=expContents(S.sub.id).cards; CUR=l; return openViewer(l,l.findIndex(c=>c.id===t.dataset.scardOpen)); }
  if(t.dataset.scen) return openScenSheet(t.dataset.scen);
  if(t.dataset.scat!==undefined){ buzz(); S.scat=t.dataset.scat; return render(); }
  if(t.dataset.dtype!==undefined){ S.dtype=t.dataset.dtype; $$('[data-dtype]').forEach(b=>b.setAttribute('aria-pressed',b===t)); return paintMCombat(); }
  if(t.dataset.like){ e.stopPropagation(); return like(t.dataset.like); }
  if(t.dataset.save){ e.stopPropagation(); return toggleSave(t.dataset.save); }
  if(t.dataset.kind!==undefined){ S.kind=t.dataset.kind; store.set('gcg-m-kind',S.kind); $$('#seg button').forEach(b=>b.setAttribute('aria-pressed',b===t)); placePill(); return refreshList(); }
  if(t.dataset.color!==undefined){ S.color=t.dataset.color; $$('.chip[data-color]').forEach(b=>b.setAttribute('aria-pressed',b===t)); return refreshList(); }
  if(t.dataset.lay!==undefined){ S.two=!S.two; store.set('gcg-m-two',S.two); return render(); }
  if(t.dataset.deck) return openSub('deck',t.dataset.deck);

    $('#mShare',sh).onclick=()=>{ copy((BOOT.url||location.href.split('?')[0])+(BOOT.url?'?view=m':''),'Link copied'); popLayer(); }; }); };

/* ---------------- desktop: one click to the full site ---------------- */
function fullUrl(){ const base=BOOT.url?BOOT.url+'?view=full':'./?full=1'; const p=BOOT.card?['card',BOOT.card]:BOOT.collection?['c',BOOT.collection]:BOOT.deck?['d',BOOT.deck]:null;
  return p?base+(base.includes('?')?'&':'?')+p[0]+'='+encodeURIComponent(p[1]):base; }
function desktopLinks(){ const u=fullUrl(); const fb=$('#fullBtn'); fb.href=u; fb.hidden=false;
  const desk=matchMedia('(pointer:fine)').matches&&Math.min(screen.width,screen.height)>=700;
  const snooze=store.get('gcg-desk-snooze',0);
  if(desk&&Date.now()>snooze){ $('#dbar').hidden=false; $('#dbarGo').href=u; $('#dbarX').onclick=()=>{ store.set('gcg-desk-snooze',Date.now()+7*864e5); $('#dbar').hidden=true; }; } }

/* ---------------- boot ---------------- */
function applyData(d){ S.cards=d.cards||[]; S.collections=d.collections||[]; S.decks=d.decks||[]; S.files=d.files||[]; S.scenarios=d.scenarios||[]; S.expansions=d.expansions||[]; S.comicSeries=d.comicSeries||[]; S.comics=d.comics||[]; S.settings=d.settings||{}; if(typeof syncGame==='function') syncGame(); if(d.liked) S.liked=new Set(d.liked);
  $('#siteTitle').textContent=S.settings.siteTitle||'The Morphin Archive'; document.title=$('#siteTitle').textContent; applyAccent(S.settings.accent); }
window.addEventListener('resize',()=>{ placePill(); if(!$('#vw').hidden){ const pg=$('#pager'); pg.scrollLeft=V.i*pg.clientWidth; } if(!$('#dv').hidden){ const pg=$('#dpager'); pg.scrollLeft=D.i*pg.clientWidth; } });
(async()=>{
  if(STANDALONE){ const q=new URLSearchParams(location.search); BOOT.card=q.get('card')||''; BOOT.collection=q.get('c')||''; BOOT.deck=q.get('d')||''; BOOT.type=q.get('t')||''; BOOT.file=q.get('f')||''; BOOT.exp=q.get('x')||''; BOOT.cseries=q.get('cs')||''; BOOT.comic=q.get('cm')||''; BOOT.page=q.get('p')||''; }
  desktopLinks();
  const pack=d=>({cards:d.cards,collections:d.collections,decks:d.decks,files:d.files||[],scenarios:d.scenarios||[],expansions:d.expansions||[],comicSeries:d.comicSeries||[],comics:d.comics||[],settings:d.settings});
  const c0=STANDALONE?store.get('gcg-cache',null):null, s0=BOOT.data&&Array.isArray(BOOT.data.cards)?BOOT.data:null;
  const cached=c0&&Array.isArray(c0.cards)?(s0&&(s0.ts||0)>(c0.ts||0)?s0:c0):s0;
  if(cached) applyData(cached);
  else { $('#main').innerHTML='<div class="loading">Loading the archive…</div>';
    try{ const d=await api('getData',visitor); applyData(d); if(STANDALONE) store.set('gcg-cache',{...pack(d),ts:Date.now()}); }
    catch(e){ $('#main').innerHTML=`<div class="empty"><b>Couldn't load</b>${esc(e.message)}<div style="margin-top:14px"><button class="btn primary" onclick="location.reload()">Try again</button></div></div>`; return; } }
  if(BOOT.type&&TYPES.some(t=>t.id===BOOT.type)) S.ctype=BOOT.type;
  render();
  if(IS_LIVE) api('getLiked',visitor).then(l=>{ S.liked=new Set(l||[]); (l||[]).forEach(syncCard); }).catch(()=>{});
  if(STANDALONE&&cached){ const was=JSON.stringify(pack(cached)); api('getData',visitor).then(d=>{ store.set('gcg-cache',{...pack(d),ts:Date.now()}); if(JSON.stringify(pack(d))!==was){ applyData(d); if($('#vw').hidden&&$('#dv').hidden) render(); } }).catch(()=>{}); }
  const bootRules=BOOT.type==='rules'||BOOT.file&&areaOf(S.files.find(f=>f.id===BOOT.file))==='rules';
  const bc=BOOT.comic&&crById(BOOT.comic);
  const linked=BOOT.card||BOOT.collection||BOOT.deck||BOOT.type||BOOT.file||BOOT.exp||BOOT.cseries||BOOT.comic;
  if(BOOT.type==='game') openGame(grHostM());
  if(BOOT.type==='wiki'){ const q=new URLSearchParams(location.search); openSub('wiki',q.get('a')?{a:q.get('a')}:q.get('wt')?{t:q.get('wt')}:{}); }
  else if(!linked) splashM();
  else if(bc){ setTab('cards'); openSub('cser',bc.s); openComicM(bc.id,BOOT.page); }
  else if(BOOT.cseries&&crSeries(BOOT.cseries)){ setTab('cards'); openSub('cser',BOOT.cseries); }
  else if(BOOT.type==='comics'){ setTab('cards'); openSub('comics',''); }
  else if(BOOT.exp&&expById(BOOT.exp)){ setTab('cards'); openSub('exp',BOOT.exp); }
  else if(BOOT.type==='expansions'){ setTab('cards'); openSub('exps',''); }
  else if(BOOT.type==='scenarios'||BOOT.type==='campaigns'){ setTab('cards'); openSub('scenarios',''); }
  else if(bootRules){ setTab('cards'); openSub('rules',''); if(BOOT.file) openFileSheet(BOOT.file); }
  else if(BOOT.type==='rpg'||BOOT.file){ setTab('rpg'); if(BOOT.file) openFileSheet(BOOT.file); }
  else if(BOOT.collection&&collById(BOOT.collection)){ setTab('sets'); openSub('set',BOOT.collection); }
  else if(BOOT.deck){ const d=deckById(BOOT.deck), c=S.cards.find(x=>x.id===BOOT.deck);
    if(d){ setTab('decks'); openSub('deck',d.id); } else if(c&&decksOf(c)[0]){ setTab('decks'); openSub('deck',decksOf(c)[0].id); } }
  if(BOOT.card){ const c=S.cards.find(x=>x.id===BOOT.card); if(c) openViewer([c],0); }
})();
</script>
</body>
